[project]
name = "web-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "githubkit>=0.16.1",
    "logfire>=5.1.0",
    "pydantic-ai>=2.54.0",
    "pydantic-ai-harness[coder,playwright,skills]>=0.54.0",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "import-linter>=2.15",
    "playwright>=1.63.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.17.2",
]
eval = [
    "arize-phoenix-client==3.5.0",
    "arize-phoenix-otel==0.17.2",
    "openinference-instrumentation-pydantic-ai==0.1.30",
]

[tool.ruff]
include = ["web_test/**/*.py", "tests/**/*.py", "pages/**/*.py", "components/**/*.py"]
line-length = 100

[tool.ruff.lint]
select = [
    "F401",
    "I",
    "UP",
    "PIE",
    "FURB",
    "SIM",
    "RET",
    "B",
    "C4",
    "PTH",
    "RUF",
    "ARG",
    "PLW1510",
    "PLR0912",
    "PLR2004",
    "E501",
    "E402",
    "ISC004",
    "S",
    "PLR0911",
    "PLR0913",
    "PLR0915",
]
ignore = ["RUF003"]

[tool.ruff.lint.pylint]
# Keyword-only options and dependency injection are not the smell; long positional
# argument lists are. 10 is today's worst case (build_record), a backstop only.
max-args = 10
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",      # callback and pytest fixture signatures are fixed by the caller
    "PLR2004",  # a number in an assertion is the specification
    "S101",     # assert is the test body
    "S105",     # fixed credentials in test fixtures
]
# Pydantic AI calls these hooks with `call=` and `tool_def=` keywords, so the names are fixed.
"web_test/automation/repair_guard.py" = ["ARG001"]
"web_test/write_guard.py" = ["ARG001"]
# JUnit XML fixture: its attribute-bearing lines cannot be wrapped without changing the fixture.
"tests/automation/test_report.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["web_test", "verify_helpers", "review_helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not live"]
markers = [
    "case(id, number): the source test-case id and case number",
    "live: needs network access to the real automationexercise.com site",
]

[tool.basedpyright]
include = ["web_test"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "standard"

[tool.importlinter]
root_package = "web_test"

[[tool.importlinter.contracts]]
name = "Shared schemas do not import planning stages, publishing, or automation"
type = "forbidden"
source_modules = ["web_test.planning.schema"]
forbidden_modules = [
    "web_test.planning.**",
    "web_test.publishing",
    "web_test.automation",
]

[[tool.importlinter.contracts]]
name = "Planning does not import automation"
type = "forbidden"
source_modules = ["web_test.planning"]
forbidden_modules = ["web_test.automation"]

[[tool.importlinter.contracts]]
name = "Review does not import verify"
type = "forbidden"
source_modules = ["web_test.planning.review"]
forbidden_modules = ["web_test.planning.verify"]

[[tool.importlinter.contracts]]
name = "Publishing does not import planning or automation"
type = "forbidden"
source_modules = ["web_test.publishing"]
forbidden_modules = ["web_test.planning", "web_test.automation"]

[[tool.importlinter.contracts]]
name = "Automation imports only the shared schema from planning"
type = "forbidden"
source_modules = ["web_test.automation"]
forbidden_modules = ["web_test.planning.**"]
ignore_imports = ["web_test.automation.** -> web_test.planning.schema"]
