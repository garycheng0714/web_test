[project]
name = "web-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "githubkit>=0.16.1",
    "logfire>=5.1.0",
    "pydantic-ai>=2.54.0",
    "pydantic-ai-harness[coder,playwright,skills]>=0.54.0",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "import-linter>=2.15",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "case(id, number): the source test-case id and case number",
]

[tool.basedpyright]
include = ["web_test"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "standard"

[tool.importlinter]
root_package = "web_test"

[[tool.importlinter.contracts]]
name = "Shared schemas do not import review or automation"
type = "forbidden"
source_modules = ["web_test.planning.schema"]
forbidden_modules = ["web_test.planning.review", "web_test.automation"]

[[tool.importlinter.contracts]]
name = "Review does not import automation"
type = "forbidden"
source_modules = ["web_test.planning.review"]
forbidden_modules = ["web_test.automation"]
