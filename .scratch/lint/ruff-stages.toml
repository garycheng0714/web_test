# Roadmap for stages 1-4. Stage 0 (F401, I, scope, line-length) is live in pyproject.toml.
# Standalone ruff config: `uv run ruff check --config .scratch/lint/ruff-stages.toml`
# Measured on web_test+tests: stage 0 = 18, stage 1 = 38, stage 2 = 49, stage 3 = 97, stage 4 = 100.
# Copy an agreed stage into pyproject.toml as [tool.ruff] and delete this file when done.

include = ["web_test/**/*.py", "tests/**/*.py"]
line-length = 100  # set from stage 0 so isort wraps imports consistently

[lint]
select = [
  # stage 0 — 18 violations, all autofix
  "F401", "I",

  # stage 1 — +20; B, RET, C4, PTH are already clean
  "UP", "PIE", "FURB", "SIM", "RET", "B", "C4", "PTH", "RUF",

  # stage 2 — +11; TRY003 declined: it needs an exception-class convention this repo lacks
  "ARG", "PLW1510", "PLR0912", "PLR2004",

  # stage 3 — +48 (E501 40, E402 3, ISC004 5); E501 drops to 22 after ruff format
  "E501", "E402", "ISC004",

  # stage 4 — +3; the other 750 are test asserts, see per-file-ignores
  "S",
]
ignore = [
  "RUF003",  # ambiguous-unicode-character-comment: full-width punctuation in prose comments
]

[lint.isort]
known-first-party = ["web_test", "verify_helpers", "review_helpers"]

[lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG",      # callback and pytest fixture signatures are fixed by the caller
  "PLR2004",  # a number in an assertion is the specification
  "S101",     # assert is the test body
  "S105",     # fixed credentials in test fixtures
]
