# Temporary workflow for the 24b-2 live verification. Remove it after the test.
name: open-live-pr

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/open-live-pr.yml

permissions:
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Open the live Test Case PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_BODY: |
            Live verification for ticket 24b-2.

            - Adds a NEEDS_REVIEW Test Case variant.
            - The required `verify-test-case` check should be `action_required`.
            - An approving review with a reason on this head should turn it into success.
            - A new head should void that approval.
            - Close this PR after the check; do not merge it.
        run: |
          existing=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head verify/live-adjudication \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open"
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head verify/live-adjudication \
            --title "Verify the required check on a Test Case PR" \
            --body "$PR_BODY"
