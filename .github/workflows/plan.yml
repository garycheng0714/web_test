name: plan

on:
  pull_request:
    types: [closed]
    paths:
      - "prd/**"

permissions:
  contents: read

jobs:
  plan:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked

      - name: Find the merged PRD
        id: prd
        run: |
          # The merged PR's own changes: the last commit on the base branch. Covers merge and squash
          # merges (GitHub's default); a multi-commit rebase merge would show only its last commit.
          mapfile -t files < <(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'prd/*.md')
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected exactly one added PRD file, got ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Design the test cases and open a PR
        env:
          WEB_TEST_RUN_ID: ${{ github.run_id }}
          WEB_TEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          WEB_TEST_BASE_URL: ${{ vars.WEB_TEST_BASE_URL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          uv run python -m web_test.planning.entrypoint \
            --prd "${{ steps.prd.outputs.path }}" \
            --base-url "${WEB_TEST_BASE_URL:?the WEB_TEST_BASE_URL repository variable is not set}" \
            --workspace .
