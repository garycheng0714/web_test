name: verify-shared

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      approval_state:
        required: false
        type: string
        default: ""
      approval_reason:
        required: false
        type: string
        default: ""
      approval_head_sha:
        required: false
        type: string
        default: ""
    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      TYPESAFE_API_KEY:
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-checks: write
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          # Only the ci `test` job saves the shared uv cache; parallel jobs race on the key.
          save-cache: false
      - run: uv sync --locked

      - name: List the changed files
        run: |
          mkdir -p .verify
          git diff --name-only --diff-filter=ACMR \
            "${{ inputs.base_sha }}...${{ inputs.head_sha }}" \
            > .verify/changed-files.txt

      - name: Resolve the verification input
        id: prepare
        run: |
          uv run python -m web_test.planning.verify prepare \
            --changed-files .verify/changed-files.txt \
            --workspace . \
            --verification-input .verify/verification-input.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore the cached verdict
        id: cache
        if: steps.prepare.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: .verify/cache
          key: verify-v2-${{ steps.prepare.outputs.key }}

      - name: Publish the verification check
        id: run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          APPROVAL_STATE: ${{ inputs.approval_state }}
          APPROVAL_REASON: ${{ inputs.approval_reason }}
          APPROVAL_HEAD_SHA: ${{ inputs.approval_head_sha }}
        run: |
          approval=()
          if [ -n "$APPROVAL_STATE" ]; then
            approval+=(
              --approval-state "$APPROVAL_STATE"
              --approval-reason "$APPROVAL_REASON"
              --approval-head-sha "$APPROVAL_HEAD_SHA"
            )
          fi
          uv run python -m web_test.planning.verify run \
            --verification-input .verify/verification-input.json \
            --head-sha "${{ inputs.head_sha }}" \
            --cache-dir .verify/cache \
            --github-output "$GITHUB_OUTPUT" \
            "${approval[@]}"

      - name: Save the cached verdict
        if: steps.run.outputs.saved == 'true' && steps.prepare.outputs.key != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .verify/cache
          key: verify-v2-${{ steps.prepare.outputs.key }}
