name: automate

on:
  pull_request:
    types: [closed]
    paths:
      - "test-case/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  automate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium

      - name: Find the merged test case
        id: case
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=A "${{ github.event.pull_request.base.sha }}" HEAD -- 'test-case/*.md')
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected exactly one added test-case file, got ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Implement the tests and open a PR
        env:
          WEB_TEST_MODEL: ${{ vars.WEB_TEST_MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m web_test.automation.entrypoint --case "${{ steps.case.outputs.path }}" --workspace .
