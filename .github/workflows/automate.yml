name: automate

on:
  pull_request:
    types: [closed]
    paths:
      - "test-case/**"

permissions:
  contents: read

jobs:
  automate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium

      - name: Find the merged test case
        id: case
        run: |
          # The merged PR's own changes: the last commit on the base branch. Covers merge and squash
          # merges (GitHub's default); a multi-commit rebase merge would show only its last commit.
          mapfile -t files < <(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'test-case/*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no test case added; nothing to automate"
            exit 0
          fi
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected exactly one added test-case file, got ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Implement the tests and open a PR
        if: steps.case.outputs.path != ''
        env:
          WEB_TEST_MODEL: ${{ vars.WEB_TEST_MODEL || 'openai-chat:kimi-k2.7-code' }}
          WEB_TEST_REPAIR_ATTEMPTS: ${{ vars.WEB_TEST_REPAIR_ATTEMPTS || '10' }}
          WEB_TEST_RUN_ID: ${{ github.run_id }}
          WEB_TEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          WEB_TEST_USAGE: "1"
          WEB_TEST_TRACE: "1"
          WEB_TEST_EVIDENCE_DIR: ${{ runner.temp }}/automation-evidence
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: uv run python -m web_test.automation.entrypoint --case "${{ steps.case.outputs.path }}" --workspace .

      - name: Upload automation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automation-evidence
          if-no-files-found: ignore
